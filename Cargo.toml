[package]
name = "envwire"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Find the environment variables your services disagree about"
license = "MIT"
repository = "https://github.com/rasalopa/envwire"
keywords = ["dotenv", "env", "docker-compose", "configuration", "linter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
